name: hetzner
# Operates the project's Hetzner box from a GitHub-hosted runner (API + SSH), so a Claude
# session or the owner (GitHub phone app) can run work there without a terminal.
#
# The project box is a DEDICATED server named `sec-8k` (created by task=create). Nothing here
# ever targets any other server unless `server` is set explicitly; the production box
# `tradeinteldesk` is never touched by default. On the box everything lives in
# /srv/sec-8k-corpus (the corpus clone); no extra nesting, no extra users, no services.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "inventory (read-only: every server/volume/firewall in the account) | prices | create (new cx33 server `sec-8k`, boot script clones corpus + installs Claude Code) | probe (read-only inventory) | run (shell command on the box, cwd /srv/sec-8k-corpus)"
        default: "probe"
      server:
        description: "server name to target (default sec-8k; never the production box unless named here)"
        default: "sec-8k"
      cmd:
        description: "for task=run: the shell command"
        default: ""
jobs:
  hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      TASK: ${{ github.event.inputs.task || 'probe' }}
      WANT: ${{ github.event.inputs.server || 'sec-8k' }}
    steps:
      - name: Secrets present
        env:
          K: ${{ secrets.HETZNER_SSH_KEY }}
          U: ${{ secrets.HETZNER_USER }}
        run: |
          [ -n "$HCLOUD_TOKEN" ] || { echo "HCLOUD_TOKEN missing"; exit 1; }
          [ -n "$K" ] || { echo "HETZNER_SSH_KEY missing"; exit 1; }
          [ -n "$U" ] || { echo "HETZNER_USER missing"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$K" > ~/.ssh/hz && chmod 600 ~/.ssh/hz && ssh-keygen -y -f ~/.ssh/hz >/dev/null && echo "ssh key parses OK"
      - name: "Prices (read-only)"
        if: env.TASK == 'prices'
        run: |
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/server_types?per_page=50" | jq -r '.server_types[] | select(.deprecated==false) | select(.name|test("^(cx|cpx|cax)")) | . as $t | ((.prices[] | select(.location=="hel1")) // .prices[0]) as $p | "  \($t.name)\t\($t.cores) vcpu\t\($t.memory) GB\t\($t.disk) GB\t\($p.price_monthly.gross | tonumber | . * 100 | round / 100) EUR/mo"' | sort -t$'\t' -k5 -n
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" https://api.hetzner.cloud/v1/pricing | jq -r '.pricing.volume | "  volume: \(.price_per_gb_month.gross | tonumber | . * 1000 | round / 1000) EUR/GB/mo"'
      - name: "Account inventory (read-only): every server, volume and firewall"
        if: env.TASK == 'inventory'
        run: |
          echo "== servers"
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?per_page=50" | jq -r '.servers[] | "  \(.name)\t\(.server_type.name)\t\(.datacenter.location.name)\t<ip masked>\t\(.status)\tcreated=\(.created[:10])\tdisk=\(.server_type.disk)GB\tvolumes=\(.volumes|length)\tfirewalls=\([.public_net.firewalls[].id]|length)"'
          echo "== volumes"
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/volumes?per_page=50" | jq -r '.volumes[] | "  \(.name)\t\(.size)GB\t\(.location.name)\tserver=\(.server)"'
          echo "== firewalls"
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/firewalls?per_page=50" | jq -r '.firewalls[] | "  \(.name)\tapplied_to=\([.applied_to[].server.id]|length) server(s)\trules=\(.rules|length)"'
          echo "== ssh keys"
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/ssh_keys" | jq -r '.ssh_keys[] | "  \(.name)\t\(.fingerprint)"'
      - name: "Create server sec-8k (cx33, hel1, ubuntu-24.04) with boot script"
        if: env.TASK == 'create'
        run: |
          if curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?name=$WANT" | jq -e '.servers|length>0' >/dev/null; then
            echo "server $WANT already exists; not creating a second one"; exit 0; fi
          cat > user_data.yaml <<'CLOUD'
          #cloud-config
          package_update: true
          packages: [git, python3, python3-pip, jq, sqlite3, screen]
          runcmd:
            - [bash, -lc, "cd /srv && git clone --depth 1 https://github.com/combomachineco-rgb/sec-8k-corpus.git sec-8k-corpus 2>&1 | tail -2"]
            - [bash, -lc, "cd /srv/sec-8k-corpus && python3 - > SETUP.txt 2>&1 <<'PY'\nimport glob,gzip,json\nn=0;f=set()\nfor p in glob.glob('data/*/*.jsonl.gz'):\n    for l in gzip.open(p,'rt',encoding='utf-8'):\n        n+=1; f.add(json.loads(l)['accession'])\nprint(f'document rows={n} filings={len(f)}')\nPY"]
            - [bash, -lc, "curl -fsSL https://claude.ai/install.sh | bash >/dev/null 2>&1 && echo 'claude installed' >> /srv/sec-8k-corpus/SETUP.txt || echo 'claude install failed' >> /srv/sec-8k-corpus/SETUP.txt"]
            - [bash, -lc, "echo BOOT_SETUP_DONE $(date -u +%FT%TZ) >> /srv/sec-8k-corpus/SETUP.txt"]
          CLOUD
          jq -n --arg name "$WANT" --rawfile ud user_data.yaml '{name:$name, server_type:"cx33", image:"ubuntu-24.04", location:"hel1", ssh_keys:["arca-server-key"], user_data:$ud, labels:{project:"sec-8k-corpus"}}' > create.json
          curl -fsS -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" -d @create.json https://api.hetzner.cloud/v1/servers > created.json
          jq -r '"created: \(.server.name) id=\(.server.id) ip=\(.server.public_net.ipv4.ip) type=\(.server.server_type.name) status=\(.server.status)"' created.json
      - name: Resolve server IP
        id: srv
        run: |
          for i in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?name=$WANT" > servers.json
            ip=$(jq -r '.servers[0].public_net.ipv4.ip // empty' servers.json); st=$(jq -r '.servers[0].status // empty' servers.json)
            [ -n "$ip" ] && [ "$st" = "running" ] && break; echo "waiting for $WANT (status=$st)"; sleep 10; done
          [ -n "$ip" ] || { echo "server $WANT not found"; exit 1; }
          echo "::add-mask::$ip"; echo "target: $WANT status=$st (ip masked)"; echo "ip=$ip" >> "$GITHUB_OUTPUT"
      - name: Wait for SSH
        env:
          U: ${{ secrets.HETZNER_USER }}
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          for i in $(seq 1 40); do ssh -i ~/.ssh/hz -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "$U@$IP" true 2>/dev/null && { echo "ssh OK"; exit 0; }; sleep 10; done
          echo "ssh not reachable"; exit 1
      - name: "After create: wait for the boot script, then verify"
        if: env.TASK == 'create'
        env:
          U: ${{ secrets.HETZNER_USER }}
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          ssh -i ~/.ssh/hz -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$U@$IP" bash -s <<'REMOTE'
          for i in $(seq 1 90); do grep -q BOOT_SETUP_DONE /srv/sec-8k-corpus/SETUP.txt 2>/dev/null && break; echo "waiting for boot script... $(date -u +%T) $(du -sh /srv/sec-8k-corpus 2>/dev/null | cut -f1)"; sleep 20; done
          echo "== SETUP.txt"; cat /srv/sec-8k-corpus/SETUP.txt 2>/dev/null || { echo "boot script not finished; cloud-init tail:"; tail -30 /var/log/cloud-init-output.log; }
          echo "== disk"; df -h / | tail -1; du -sh /srv/sec-8k-corpus 2>/dev/null
          echo "== tools"; git --version; python3 --version; ls -la ~/.local/bin/claude 2>/dev/null || echo "claude binary not found"
          echo "== sshd password auth"; sshd -T 2>/dev/null | grep -E '^passwordauthentication' || grep -i '^PasswordAuthentication' /etc/ssh/sshd_config
          REMOTE
      - name: "Probe (read-only)"
        if: env.TASK == 'probe'
        env:
          U: ${{ secrets.HETZNER_USER }}
          IP: ${{ steps.srv.outputs.ip }}
        run: |
          ssh -i ~/.ssh/hz -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$U@$IP" bash -s <<'REMOTE'
          set +e
          echo "== host"; hostname; grep PRETTY /etc/os-release; echo "cpus=$(nproc) mem=$(free -h | awk '/Mem/{print $2}') disk_free=$(df -h / | awk 'NR==2{print $4}')"
          echo "== /srv"; ls -la /srv; [ -f /srv/sec-8k-corpus/SETUP.txt ] && cat /srv/sec-8k-corpus/SETUP.txt
          echo "== tools"; for t in git python3 sqlite3 claude ~/.local/bin/claude; do printf '%-22s ' $t; command -v $t >/dev/null && $t --version 2>&1 | head -1 || echo absent; done
          echo "== services"; systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}' | grep -vE '^(ssh|systemd|dbus|cron|rsyslog|getty|polkit|networkd|resolved|journald|udev|snap|unattended|qemu|chrony|ntp|multipath|lvm|apparmor|ModemManager|serial|cloud|user@)' | head
          echo "== ports"; ss -tlnp | awk 'NR>1{print $4}' | sort -u
          REMOTE
      - name: "Run command (cwd /srv/sec-8k-corpus)"
        if: env.TASK == 'run'
        env:
          U: ${{ secrets.HETZNER_USER }}
          IP: ${{ steps.srv.outputs.ip }}
          CMD: ${{ github.event.inputs.cmd }}
        run: |
          [ -n "$CMD" ] || { echo "cmd input is empty"; exit 1; }
          printf '%s' "$CMD" | base64 -w0 > cmd.b64
          ssh -i ~/.ssh/hz -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$U@$IP" "cd /srv/sec-8k-corpus && bash -c \"\$(echo $(cat cmd.b64) | base64 -d)\""
